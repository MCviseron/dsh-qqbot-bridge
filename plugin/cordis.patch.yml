# dsh-qq-bridge bundle patch — inserts the Host-half bridge row into the
# profile roster. The plugin listens on loopback for the external QQ bot
# process, injects each QQ message as a Session prompt, and relays the
# assistant reply plus every pending tool approval back to the bot.
- insert:
    - id: qq-bridge
      # 必须和 npm 上发布的包名一致（发布时 CI 会改成 scoped 名）。
      # 本地开发用 link 时，改成你自己的 "dsh-qq-bridge": "link:<path>" 条目名即可。
      name: '@mcviseron/dsh-qq-bridge'
      config:
        enabled: true
        host: '127.0.0.1'
        port: 39061
        token: ''
        cwd: ''
        statePath: ''
        approvalTimeoutMs: 180000
        approvalDefault: 'reject'
