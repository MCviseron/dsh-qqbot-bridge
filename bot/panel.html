<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH QQ 机器人 · 设置</title>
<style>
:root{--bg:#141519;--card:#1c1e24;--line:#2b2f38;--fg:#e7e9ee;--dim:#98a0ad;--accent:#4a7dff;--ok:#3ddc84;--bad:#ff5d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:600}
.pill{padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim);font-size:12px}
.pill.ok{color:#0b1d12;background:var(--ok);border-color:var(--ok)}
.pill.bad{color:#fff;background:var(--bad);border-color:var(--bad)}
main{max-width:900px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.row label{color:var(--fg)}
.row .hint{color:var(--dim);font-size:12px}
input[type=number],input[type=text],input[type=password]{background:#111318;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 8px;width:120px;text-align:right}
input[type=text].wide,input[type=password].wide{width:240px;text-align:left}
switch{display:inline-flex}
.sw{position:relative;width:44px;height:24px;border-radius:99px;background:#33384a;cursor:pointer;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}
button{background:#242834;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:#3b4250}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#ffb4b4;border-color:#4a2a2a}
.actions{display:flex;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#242834;border:1px solid var(--line);padding:8px 16px;border-radius:8px;opacity:0;transition:.2s}
#toast.show{opacity:1}
code{color:var(--dim);font-size:12px}
</style></head><body>
<header><h1>DSH QQ 机器人</h1>
<span class="pill" id="p-run">进程 · ?</span>
<span class="pill" id="p-online">在线 · ?</span>
<span class="pill" id="p-bridge">桥接 · ?</span>
<span class="pill" id="p-pid">pid · -</span></header>
<main>
<section><h2>总开关</h2>
<div class="row"><label>接收消息（总）<div class="hint">关掉后私聊与群聊都不再响应</div></label><div class="sw" data-key="enabled"></div></div>
<div class="row"><label>私聊响应</label><div class="sw" data-key="c2c_enabled"></div></div>
<div class="row"><label>群聊响应</label><div class="sw" data-key="group_enabled"></div></div>
<div class="row"><label>群全量消息<div class="hint">需要在开放平台开启全量接收</div></label><div class="sw" data-key="group_full_mode"></div></div>
</section>
<section><h2>群聊节奏</h2>
<div class="row"><label>攒够几条触发判断</label><input type="number" min="1" max="30" data-key="chatter_batch"></div>
<div class="row"><label>最长等待（秒）</label><input type="number" min="5" max="600" data-key="chatter_max_s"></div>
<div class="row"><label>判断后冷却（秒）</label><input type="number" min="0" max="1800" data-key="chatter_cooldown_s"></div>
<div class="row"><label>「最近说过」记忆（秒）</label><input type="number" min="30" max="3600" data-key="bot_say_memory_s"></div>
<div class="row"><label>回合卡死判定（秒）</label><input type="number" min="30" max="1800" data-key="stuck_turn_s"></div>
</section>
<section><h2>发送</h2>
<div class="row"><label>Markdown 自动<div class="hint">回复像 MD 时用 msg_type=2 发送</div></label><div class="sw" data-key="md_auto"></div></div>
<div class="row"><label>流式输出（仅私聊）<div class="hint">平台只在单聊支持流式，群里自动整段发</div></label><div class="sw" data-key="stream_enabled"></div></div>
<div class="row"><label>流式节流（毫秒）<div class="hint">越小越流畅，太小会被限流</div></label><input type="number" min="50" max="2000" step="50" data-key="stream_interval_ms"></div>
<div class="row"><label>识别引用消息<div class="hint">引用时把被引用原文/来源一起带给模型</div></label><div class="sw" data-key="quote_enabled"></div></div>
<div class="row"><label>消息池保留（秒）<div class="hint">引用解析、/撤回、插话判断共用的窗口</div></label><input type="number" min="60" max="86400" step="60" data-key="pool_ttl_s"></div>
<div class="row"><label>消息池上限（条）<div class="hint">窗口内最多保留多少条消息</div></label><input type="number" min="10" max="1000" step="10" data-key="pool_max"></div>
<div class="row"><label>引用原文上限（字）<div class="hint">对方引用消息时，带给模型的被引用内容长度</div></label><input type="number" min="50" max="2000" step="10" data-key="quote_context_chars"></div>
<div class="row"><label>引用排查日志<div class="hint">把平台原始引用字段打进日志，排查完请关闭</div></label><div class="sw" data-key="quote_probe"></div></div>
<div class="row"><label>迟到提示延迟（秒）</label><input type="number" min="0" max="120" data-key="ack_delay_s"></div>
<div class="row"><label>连发合并（毫秒）</label><input type="number" min="0" max="5000" data-key="debounce_ms"></div>
<div class="row"><label>单条最大字数</label><input type="number" min="200" max="4000" data-key="max_chars"></div>
</section>
<section><h2>凭据（留空则继续用 .env）</h2>
<div class="row"><label>APPID</label><input type="text" class="wide" data-key="appid" placeholder="不改"></div>
<div class="row"><label>APPSECRET</label><input type="password" class="wide" data-key="appsecret" placeholder="不改"></div>
<div class="row"><label class="hint">修改凭据后需要「重启机器人」才会生效</label></div>
</section>
<section><h2>进程管理</h2>
<div class="actions"><button class="primary" id="btn-start">启动</button>
<button id="btn-restart">重启</button>
<button class="danger" id="btn-stop">关闭（不拉起）</button></div>
<div class="row"><label class="hint" id="p-note">—</label></div>
</section>
<section><h2>QQ 平台</h2>
<div class="actions"><button class="primary" onclick="window.open('https://q.qq.com/qqbot/','_blank','noopener')">打开 QQ 网页端设置</button>
<button onclick="window.open('https://bot.q.qq.com/wiki/','_blank','noopener')">机器人开发文档</button></div>
<div class="row"><label class="hint">在新标签页打开 QQ 开放平台的机器人管理 / 开发设置</label></div>
</section>
<section><h2>保存</h2><div class="actions"><button class="primary" id="btn-save">保存设置</button><button id="btn-reload">重新读取</button></div></section>
<section><h2>运行日志 <span class="hint" id="log-meta" style="font-size:12px;color:var(--dim)"></span></h2>
<pre id="log" style="margin:0;max-height:320px;overflow:auto;background:#0e1014;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,Consolas,monospace;color:#c9d1d9;white-space:pre-wrap"></pre>
<div class="actions" style="margin-top:8px"><button id="btn-log-refresh">刷新日志</button><label class="hint"><input type="checkbox" id="log-auto" checked> 自动刷新（2s）</label></div>
</section>
</main><div id="toast"></div>
<script>
var TOKEN = new URLSearchParams(location.search).get("t") || "";
function api(path, opts){ opts = opts || {}; opts.headers = Object.assign({"x-panel-token": TOKEN, "content-type": "application/json"}, opts.headers || {}); return fetch(path, opts).then(function(r){ return r.json(); }); }
function toast(msg){ var el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); setTimeout(function(){ el.classList.remove("show"); }, 1800); }
function setSw(key, val){ var el = document.querySelector(".sw[data-key=\"" + key + "\"]"); if(!el) return; if(val) el.classList.add("on"); else el.classList.remove("on"); }
function isOn(key){ var el = document.querySelector(".sw[data-key=\"" + key + "\"]"); return el ? el.classList.contains("on") : false; }
function fill(cfg){ Object.keys(cfg).forEach(function(key){ var sw = document.querySelector(".sw[data-key=\"" + key + "\"]"); if(sw){ setSw(key, !!cfg[key]); return; } var input = document.querySelector("input[data-key=\"" + key + "\"]"); if(input){ input.value = cfg[key] === null || cfg[key] === undefined ? "" : cfg[key]; } }); }
function collect(){ var out = {}; document.querySelectorAll(".sw[data-key]").forEach(function(el){ out[el.getAttribute("data-key")] = el.classList.contains("on"); }); document.querySelectorAll("input[data-key]").forEach(function(el){ var key = el.getAttribute("data-key"); var val = el.value; if(val === "") return; if(key === "appid" || key === "appsecret"){ if(val.indexOf("****") >= 0) return; out[key] = val; return; } out[key] = Number(val); }); return out; }
function refresh(){ api("/api/state").then(function(s){ document.getElementById("p-run").textContent = "进程 · " + (s.bot.running ? "运行中" : "已停止"); document.getElementById("p-run").className = "pill " + (s.bot.running ? "ok" : "bad"); document.getElementById("p-online").textContent = "在线 · " + (s.bot.online ? "是" : "否"); document.getElementById("p-online").className = "pill " + (s.bot.online ? "ok" : "bad"); document.getElementById("p-bridge").textContent = "桥接 · " + (s.bridge || "unknown"); document.getElementById("p-bridge").className = "pill " + (s.bridge === "ready" ? "ok" : "bad"); document.getElementById("p-pid").textContent = "pid · " + (s.bot.pid || "-"); document.getElementById("p-note").textContent = s.bot.note || "—"; fill(s.config); }).catch(function(err){ document.getElementById("p-note").textContent = "读取失败：" + (err && err.message ? err.message : err) + "（面板地址 " + location.origin + " → 127.0.0.1:39062）"; toast("读取失败，请看下方说明"); }); }
document.querySelectorAll(".sw").forEach(function(el){ el.addEventListener("click", function(){ el.classList.toggle("on"); }); });
document.getElementById("btn-save").addEventListener("click", function(){ api("/api/config", {method:"POST", body: JSON.stringify(collect())}).then(function(){ toast("已保存，立即生效（凭据需重启）"); refresh(); }).catch(function(){ toast("保存失败"); }); });
document.getElementById("btn-reload").addEventListener("click", refresh);
function loadLog(){ api("/api/logs?lines=300").then(function(r){ var el = document.getElementById("log"); var lines = r.lines || []; el.textContent = lines.length ? lines.join("\n") : "（暂无输出）"; el.scrollTop = el.scrollHeight; document.getElementById("log-meta").textContent = lines.length ? "· 最近 " + lines.length + " 行" : ""; }).catch(function(){ document.getElementById("log").textContent = "日志服务不可达（supervisor 未运行）"; }); }
document.getElementById("btn-log-refresh").addEventListener("click", loadLog);
loadLog();
setInterval(function(){ if(document.getElementById("log-auto").checked) loadLog(); }, 2000);
function manage(action){ api("/api/manage", {method:"POST", body: JSON.stringify({action: action})}).then(function(r){ toast(r.message || action); setTimeout(refresh, 900); }).catch(function(){ toast("操作失败"); }); }
document.getElementById("btn-start").addEventListener("click", function(){ manage("start"); });
document.getElementById("btn-stop").addEventListener("click", function(){ manage("stop"); });
document.getElementById("btn-restart").addEventListener("click", function(){ manage("restart"); });
if (location.protocol === "file:") {
  var warn = document.createElement("div");
  warn.style.cssText = "margin:16px;padding:12px 16px;border-radius:10px;background:#4a2a2a;color:#ffd7d7;font-size:13px";
  warn.textContent = "当前是直接打开本地文件（file://），接口读不到。请改成 http://127.0.0.1:39062/?t=<BRIDGE_TOKEN> 访问，或双击 bot\\open-panel.bat。";
  document.body.insertBefore(warn, document.body.firstChild);
}
refresh(); setInterval(refresh, 5000);
</script></body></html>
