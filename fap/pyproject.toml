[project]
name = "fap"
version = "0.1.0"
description = "QQ bot framework: core + plugins (frame and plugin)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# GUI 版本才需要（非 GUI 版本不需要任何第三方依赖）
gui = ["aiohttp>=3.9"]
# 真正连 QQ 时需要的 SDK（私有包，按你的部署方式安装）
qq = ["viseron-qqbotpy"]

[project.scripts]
fap = "framework.cli:main"

[tool.setuptools]
packages = ["framework", "framework.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
