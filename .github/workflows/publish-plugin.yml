name: publish-plugin

on:
  push:
    tags: ["plugin-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax and plugin tests
        working-directory: plugin
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/server.js
          node --check lib/store.js
          node --check lib/install.js
          node --test test/smoke.mjs test/plugin.test.mjs
          node test/install.test.mjs
      - name: tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        working-directory: plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const v=require('./package.json').version;const t=process.env.TAG.slice(8);if(v!==t){console.error('package.json',v,'!= tag',t);process.exit(1)}console.log('version ok',v)"

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: publish under the scoped name (local name must match the DSH profile key)
        run: |
          npm pkg set name=@mcviseron/dsh-qq-bridge
          # 浏览器半身必须用同一个 id 注册，否则宿主报 "loaded without registering"
          node scripts/scope-client-id.mjs
          grep -q "id: \"@mcviseron/dsh-qq-bridge\"" lib/client.js
      - name: pack check
        run: npm pack --dry-run
      - name: upgrade npm (OIDC trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest
      - name: publish via OIDC trusted publisher
        run: npm publish --access public --provenance
